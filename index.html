        <h1>Desenvolvimento de software sob medida.</h1>
        <p>Transformo suas ideias em aplicativos, sites e sistemas de alto nível.</p>
        <p>Desenvolvedor de software sênior especializado em criar produtos digitais escaláveis para empresas, startups e empreendedores. React Native, React, Next.js, Angular, TypeScript e integrações — com o foco em prazo, clareza e um produto que dá para usar.</p>
        <h2>Serviços de engenharia de software.</h2>
        <ul><li><a href="https://cristianovieira1.github.io/portfolio/servicos/desenvolvimento-de-aplicativos/">Desenvolvimento de aplicativos</a> — Aplicativos para empresas que precisam sair da ideia, destravar um produto ou colocar uma operação no bolso do cliente. O foco é um produto utilizável, estável e possível de evoluir.</li><li><a href="https://cristianovieira1.github.io/portfolio/servicos/react-native/">Desenvolvedor React Native</a> — React Native é a base com que mais entrego produtos mobile. Uso essa especialidade para tirar um app do papel, estabilizar um produto em produção ou reforçar um time sem aumentar a estrutura fixa.</li><li><a href="https://cristianovieira1.github.io/portfolio/servicos/criacao-de-sites/">Criação de sites profissionais</a> — Sites para quem precisa explicar uma oferta com clareza, aparecer melhor nas buscas e transformar visita em conversa. O visual acompanha o conteúdo, não o contrário.</li><li><a href="https://cristianovieira1.github.io/portfolio/servicos/desenvolvimento-de-sistemas/">Desenvolvimento de sistemas web</a> — Sistemas para substituir planilha, e-mail e processo manual quando a operação já tem regra demais para uma página institucional. O critério é a rotina de quem usa, não um painel genérico.</li><li><a href="https://cristianovieira1.github.io/portfolio/servicos/desenvolvimento-saas/">Desenvolvimento de SaaS</a> — Produtos SaaS para quem precisa transformar um serviço repetível em software: conta, permissão, cobrança e uma rotina que o cliente volta a usar.</li><li><a href="https://cristianovieira1.github.io/portfolio/servicos/consultoria-e-modernizacao/">Consultoria e modernização de sistemas</a> — Para times que já têm software e precisam de clareza: o que corrigir, o que manter e o que não vale reescrever agora.</li></ul>
        <h2>Sistemas reais, com contexto comercial.</h2>
        <ul><li><a href="https://cristianovieira1.github.io/portfolio/projetos/jobtto/">Jobtto</a> — Plataforma para conectar demanda e profissionais, com a mesma lógica de produto no aplicativo e no site.</li><li><a href="https://cristianovieira1.github.io/portfolio/projetos/mais-negocio-vibra/">Mais Negócio Vibra</a> — Produto mobile usado na operação da Vibra Energia, em evolução contínua por um time alocado.</li><li><a href="https://cristianovieira1.github.io/portfolio/projetos/colombo-bank/">Colombo Bank</a> — Aplicativo bancário para acompanhar cartão, limite e faturas no uso cotidiano.</li><li><a href="https://cristianovieira1.github.io/portfolio/projetos/gazin-bank/">Gazin Bank</a> — Aplicativo financeiro com operações que dependem de APIs e de um feedback claro para o usuário.</li><li><a href="https://cristianovieira1.github.io/portfolio/projetos/parceiro-da-construcao/">Parceiro da Construção</a> — Aplicativo educacional para profissionais da construção, com conteúdo e jornadas de aprendizado.</li><li><a href="https://cristianovieira1.github.io/portfolio/projetos/bateponto-pontotel/">Bateponto Pontotel</a> — App de ponto usado no dia a dia, onde a marcação precisa funcionar mesmo com conexão ruim.</li><li><a href="https://cristianovieira1.github.io/portfolio/projetos/topotronics/">Topotronics</a> — App independente para cálculos de engenharia de estradas, com conta, publicação e assinatura.</li><li><a href="https://cristianovieira1.github.io/portfolio/projetos/sistema-siga/">Sistema SIGA</a> — Sistema usado na operação, com presença em aplicativo e web.</li><li><a href="https://cristianovieira1.github.io/portfolio/projetos/otica-house/">Ótica House</a> — E-commerce web focado em catálogo, clareza do funil e a plataforma VTEX.</li></ul>
        <h2>Antes de pedirmos um orçamento.</h2>
        <h3>Que tipo de projeto você assume?</h3><p>Aplicativos iOS e Android, sites profissionais, sistemas web, SaaS e consultoria para modernizar o que já existe. React Native é a especialidade mais profunda; web e integrações entram quando o produto pede.</p><h3>Eu preciso entender React Native para contratar?</h3><p>Não. Empresas contratam um resultado: um aplicativo, um site, um sistema ou um produto recorrente. A stack é ferramenta. Na conversa de orçamento falamos de problema, prazo e recorte.</p><h3>Como funciona o orçamento?</h3><p>Você descreve o objetivo, o tipo de projeto e o prazo. Eu retorno com perguntas objetivas e uma proposta de recorte. Não há tabela pública de preço porque o esforço muda com o que já existe.</p><h3>Você trabalha por projeto ou por período?</h3><p>Os dois. Escopo fechado para entregas definidas; hora ou mensal para evolução e reforço de time.</p><h3>Atende só Porto Alegre?</h3><p>Estou em Porto Alegre, no Rio Grande do Sul, e atendo remoto em todo o Brasil. Reuniões presenciais só quando o projeto pede e for viável.</p>
