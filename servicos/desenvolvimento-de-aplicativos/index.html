          <h1>Desenvolvimento de aplicativos</h1>
          <p>Aplicativos para empresas que precisam sair da ideia, destravar um produto ou colocar uma operação no bolso do cliente. O foco é um produto utilizável, estável e possível de evoluir.</p>
          <p>Um aplicativo costuma falhar quando o escopo mistura validação com uma plataforma inteira, ou quando o código já em produção não acompanha o uso real. Eu entro para definir o que precisa existir agora, construir as jornadas principais e deixar integrações, publicação e manutenção em ordem. Atendo a partir de Porto Alegre, no Rio Grande do Sul, e trabalho remoto com empresas em todo o Brasil.</p>
          <h2>Benefícios</h2>
          <h3>Uma base, duas lojas</h3><p>iOS e Android a partir de uma base compartilhada quando isso reduz prazo e custo sem sacrificar a experiência.</p><h3>Escopo que cabe no momento</h3><p>MVP, evolução ou reforço de time, com entregas que o negócio consegue usar e avaliar.</p><h3>Integrações reais</h3><p>Autenticação, APIs, notificações, pagamentos e serviços que o produto precisa para funcionar fora do protótipo.</p><h3>Publicação acompanhada</h3><p>Preparação para App Store e Google Play, com o fluxo de build e os cuidados de uma versão que vai para usuários reais.</p>
          <h2>Entregáveis</h2>
          <ul><li>Leitura do objetivo, do usuário e das restrições técnicas</li><li>Arquitetura e escopo da primeira versão utilizável</li><li>Interfaces e jornadas principais do aplicativo</li><li>Integração com APIs, autenticação e serviços de terceiros</li><li>Build, testes das jornadas críticas e preparação das lojas</li><li>Passagem de contexto para o time que vai manter o produto</li></ul>
          <h2>FAQ</h2>
          <h3>Dá para lançar primeiro um MVP?</h3><p>Sim. A primeira versão cobre o que valida a operação ou a proposta de valor, sem tratar o restante do roadmap como se precisasse nascer junto.</p><h3>Você assume um aplicativo que já existe?</h3><p>Sim. O início é uma leitura do código, das dependências, da publicação e dos pontos de risco. A partir disso, as entregas seguem uma ordem segura entre correção, estrutura e funcionalidades.</p><h3>O aplicativo precisa de um site ou painel junto?</h3><p>Quando o negócio pede, o aplicativo pode nascer junto de um site, um painel ou um sistema web. Isso é definido no escopo, não como um extra surpresa.</p>
