          <h1>Consultoria e modernização de sistemas</h1>
          <p>Para times que já têm software e precisam de clareza: o que corrigir, o que manter e o que não vale reescrever agora.</p>
          <p>Modernizar um sistema falha quando a primeira proposta é jogar tudo fora. Eu começo pelo uso real, pelo código e pelo caminho de publicação. O resultado é uma sequência: riscos, ganhos rápidos e as mudanças estruturais que realmente liberam o roadmap. Atendo a partir de Porto Alegre, no Rio Grande do Sul, e trabalho remoto com empresas em todo o Brasil.</p>
          <h2>Benefícios</h2>
          <h3>Diagnóstico antes da reforma</h3><p>Uma leitura honesta do que está frágil e do que pode continuar como está.</p><h3>Plano que o time executa</h3><p>A consultoria pode parar no plano ou seguir com a implementação das primeiras entregas.</p><h3>Reforço sênior pontual</h3><p>Entrada temporária para destravar uma entrega crítica sem contratar um time permanente.</p><h3>Stack que você já tem</h3><p>React Native, React, Next.js, Angular, TypeScript e Firebase, conforme o sistema existente.</p>
          <h2>Entregáveis</h2>
          <ul><li>Leitura de código, fluxo de publicação e riscos</li><li>Lista priorizada de correções e mudanças estruturais</li><li>Recomendação do que não fazer agora</li><li>Implementação das primeiras melhorias, se contratada</li><li>Apoio a decisões de arquitetura com o time</li><li>Registro objetivo para quem continua o trabalho</li></ul>
          <h2>FAQ</h2>
          <h3>Consultoria inclui código?</h3><p>Pode incluir. Há um formato só de diagnóstico e outro em que eu implemento as primeiras mudanças. Os dois são combinados antes de começar.</p><h3>Você reescreve o sistema?</h3><p>Só quando a reescrita é mais segura do que evoluir o que existe. Na maior parte dos casos, a modernização acontece por partes, com o sistema atual ainda em uso.</p><h3>Serve para recrutadores?</h3><p>Este serviço é para empresas que precisam de critério técnico. Recrutadores encontram experiência, stack e currículo na página de carreira.</p>
