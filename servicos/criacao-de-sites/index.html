          <h1>Criação de sites profissionais</h1>
          <p>Sites para quem precisa explicar uma oferta com clareza, aparecer melhor nas buscas e transformar visita em conversa. O visual acompanha o conteúdo, não o contrário.</p>
          <p>Um site profissional deixa de cumprir a função quando o visitante não entende o serviço, o contato está escondido ou a página depende demais de efeitos para dizer o essencial. Eu estruturo a mensagem, a hierarquia e a parte técnica para a página ser rápida, indexável e fácil de usar no celular. Atendo a partir de Porto Alegre, no Rio Grande do Sul, e trabalho remoto com empresas em todo o Brasil.</p>
          <h2>Benefícios</h2>
          <h3>Mensagem antes da decoração</h3><p>A primeira tela diz o que você faz, para quem e como começar uma conversa.</p><h3>Base de SEO no HTML</h3><p>Título, descrição, heading, conteúdo e dados estruturados pensados para cada página, não só para a home.</p><h3>Contato sem fricção</h3><p>Formulário, WhatsApp ou e-mail no ponto em que a pessoa já entendeu a oferta.</p><h3>Celular como padrão</h3><p>Leitura, botões e velocidade tratados a partir da tela pequena, onde a maior parte das visitas chega.</p>
          <h2>Entregáveis</h2>
          <ul><li>Estrutura de páginas e texto orientado à oferta</li><li>Layout responsivo e identidade visual aplicada</li><li>SEO técnico da página: título, descrição, heading e sitemap</li><li>Formulário ou canal de contato funcionando</li><li>Performance de imagens, fontes e carregamento inicial</li><li>Publicação e orientação para a próxima iteração</li></ul>
          <h2>FAQ</h2>
          <h3>O site pode crescer para um sistema?</h3><p>Sim, se isso estiver no horizonte. A primeira entrega pode ser o site comercial, com uma estrutura que não impeça um painel ou uma área logada depois.</p><h3>Você escreve o conteúdo?</h3><p>Eu organizo a estrutura e proponho o texto a partir do que você sabe sobre o negócio. A revisão final da oferta fica com você, porque ninguém substitui o conhecimento do dono.</p><h3>Site institucional entra nesse serviço?</h3><p>Sim. Sites institucionais, páginas de serviço e sites de captação entram aqui. Lojas e plataformas com regra de negócio mais pesada tendem a ir para sistemas ou SaaS.</p>
