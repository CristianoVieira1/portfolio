    <script>
      (() => {
        const contentByLocale = {
          en: {
            htmlLang: "en",
            title: "Cristiano Borges | Senior React Native Developer",
            description:
              "Portfolio of Cristiano Borges, React Native developer with 6+ years of experience building iOS, Android and web products.",
            ogTitle: "Cristiano Borges | Senior React Native Developer",
            ogDescription:
              "Portfolio of Cristiano Borges, React Native developer with 6+ years of experience building iOS, Android and web products.",
            ogSiteName: "Cristiano Borges Portfolio",
            ogLocale: "en_US",
            twitterTitle: "Cristiano Borges | Senior React Native Developer",
            twitterDescription:
              "Portfolio of Cristiano Borges, React Native developer with 6+ years of experience building iOS, Android and web products.",
          },
          ptBR: {
            htmlLang: "pt-BR",
            title: "Cristiano Borges | Desenvolvedor React Native Sênior",
            description:
              "Portfólio de Cristiano Borges, desenvolvedor React Native com mais de 6 anos de experiência em aplicativos iOS, Android e produtos web.",
            ogTitle: "Cristiano Borges | Desenvolvedor React Native Sênior",
            ogDescription:
              "Portfólio de Cristiano Borges, desenvolvedor React Native com mais de 6 anos de experiência em aplicativos iOS, Android e produtos web.",
            ogSiteName: "Portfólio de Cristiano Borges",
            ogLocale: "pt_BR",
            twitterTitle: "Cristiano Borges | Desenvolvedor React Native Sênior",
            twitterDescription:
              "Portfólio de Cristiano Borges, desenvolvedor React Native com mais de 6 anos de experiência em aplicativos iOS, Android e produtos web.",
          },
        };

        const brazilTimezones = new Set([
          "America/Sao_Paulo",
          "America/Rio_Branco",
          "America/Manaus",
          "America/Belem",
          "America/Fortaleza",
          "America/Recife",
          "America/Maceio",
          "America/Bahia",
          "America/Araguaina",
          "America/Cuiaba",
          "America/Campo_Grande",
          "America/Porto_Velho",
          "America/Boa_Vista",
          "America/Noronha",
        ]);

        const browserLanguages = [
          ...(navigator.languages || []),
          navigator.language,
        ]
          .filter(Boolean)
          .map((lang) => lang.toLowerCase());

        const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const isBrazilLocale = browserLanguages.includes("pt-br");
        const isBrazilTimezone =
          Boolean(timeZone) && brazilTimezones.has(timeZone);
        const usePortuguese = isBrazilLocale || isBrazilTimezone;
        const selected = usePortuguese
          ? contentByLocale.ptBR
          : contentByLocale.en;

        const setMeta = (selector, value) => {
          const tag = document.querySelector(selector);
          if (tag && value) {
            tag.setAttribute("content", value);
          }
        };

        document.documentElement.lang = selected.htmlLang;
        document.title = selected.title;

        setMeta('meta[name="description"]', selected.description);
        setMeta('meta[property="og:title"]', selected.ogTitle);
        setMeta('meta[property="og:description"]', selected.ogDescription);
        setMeta('meta[property="og:site_name"]', selected.ogSiteName);
        setMeta('meta[property="og:locale"]', selected.ogLocale);
        setMeta('meta[name="twitter:title"]', selected.twitterTitle);
        setMeta(
          'meta[name="twitter:description"]',
          selected.twitterDescription,
        );
      })();
    </script>
