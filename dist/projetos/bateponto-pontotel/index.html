          <h1>Bateponto Pontotel</h1>
          <p>App de ponto usado no dia a dia, onde a marcação precisa funcionar mesmo com conexão ruim.</p>
          <h2>Problema</h2>
          <p>Ponto digital falha quando a marcação depende de rede estável ou quando biometria e localização não conversam com o fluxo principal. O risco é operacional: o registro deixa de ser confiável.</p>
          <h2>Participação</h2>
          <p>Manutenção e evolução de marcações, autenticação e jornadas críticas, incluindo correção de falhas e suporte offline.</p>
          <h2>Solução</h2>
          <p>Suporte offline, biometria, geolocalização e correção de bugs críticos. O critério de qualidade era a marcação chegar certa, não a quantidade de telas novas.</p>
          <h2>Impacto</h2>
          <p>Jornadas de ponto mais estáveis no uso diário. Indicadores internos de adesão não são publicados aqui.</p>
