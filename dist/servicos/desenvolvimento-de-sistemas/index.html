          <h1>Desenvolvimento de sistemas web</h1>
          <p>Sistemas para substituir planilha, e-mail e processo manual quando a operação já tem regra demais para uma página institucional. O critério é a rotina de quem usa, não um painel genérico.</p>
          <p>Empresas chegam com um fluxo espalhado entre planilhas, mensagens e sistemas que não conversam. Um sistema web bem definido concentra a operação: cadastro, permissões, status, integrações e um histórico que o time consegue consultar. Eu desenho esse recorte com você e entrego em partes que já entram no dia a dia. Atendo a partir de Porto Alegre, no Rio Grande do Sul, e trabalho remoto com empresas em todo o Brasil.</p>
          <h2>Benefícios</h2>
          <h3>Fluxo antes da tela</h3><p>O sistema nasce do processo real: quem faz o quê, o que muda de estado e onde estão os dados.</p><h3>Integração com o que já existe</h3><p>APIs, autenticação e serviços externos entram no desenho em vez de ficarem para um fase dois indefinida.</p><h3>Entregas utilizáveis</h3><p>Cada etapa deixa uma parte do processo funcionando, para o time validar com uso real.</p><h3>Base para crescer</h3><p>Módulos, permissões e integrações organizados para o sistema não depender de um único arquivo gigante.</p>
          <h2>Entregáveis</h2>
          <ul><li>Mapa do processo e do primeiro recorte do sistema</li><li>Autenticação, perfis e jornadas principais</li><li>Telas operacionais e regras de negócio acordadas</li><li>Integrações com APIs e serviços já usados pela empresa</li><li>Tratamento de erro, estados vazios e permissões</li><li>Documentação curta da arquitetura e do que ficou de fora</li></ul>
          <h2>FAQ</h2>
          <h3>Sistema web e site são a mesma coisa?</h3><p>Não. O site apresenta a empresa e capta contato. O sistema executa o trabalho: cadastros, pedidos, permissões, rotinas e integrações.</p><h3>Dá para modernizar um sistema antigo?</h3><p>Sim. Esse trabalho também está na consultoria e modernização. A decisão entre reescrever, encapsular ou migrar por partes depende do risco e do que já está em uso.</p><h3>Você faz o backend?</h3><p>Eu integro e, quando o escopo pede, implemento a camada necessária com as ferramentas do projeto, como Firebase ou APIs. Se já existe um backend, eu trabalho em cima dele.</p>
