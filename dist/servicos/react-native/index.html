          <h1>Desenvolvedor React Native</h1>
          <p>React Native é a base com que mais entrego produtos mobile. Uso essa especialidade para tirar um app do papel, estabilizar um produto em produção ou reforçar um time sem aumentar a estrutura fixa.</p>
          <p>Times procuram um desenvolvedor React Native quando o roadmap parou, a base ficou difícil de mudar ou o produto precisa de alguém que una interface, integração e publicação. Eu trabalho nesse intervalo: código, critério de produto e comunicação direta com quem decide. Atendo a partir de Porto Alegre, no Rio Grande do Sul, e trabalho remoto com empresas em todo o Brasil.</p>
          <h2>Benefícios</h2>
          <h3>Produto e código no mesmo lugar</h3><p>As decisões técnicas consideram quem usa o aplicativo e o que o negócio precisa lançar agora.</p><h3>Produção, não só protótipo</h3><p>Experiência com apps financeiros, operacionais, educacionais e de marketplace já em uso.</p><h3>Entrada em código existente</h3><p>Leitura da base, dos riscos e do fluxo de publicação antes de prometer uma sequência de entregas.</p><h3>Contrato por escopo ou período</h3><p>Projeto fechado, horas ou apoio mensal, conforme a forma de trabalho do time.</p>
          <h2>Entregáveis</h2>
          <ul><li>Avaliação inicial de código, dependências e publicação</li><li>Novas jornadas ou correção de fluxos críticos</li><li>Organização de estado, navegação e integração com APIs</li><li>Ajustes de performance e estabilidade nas telas mais usadas</li><li>Apoio a builds, lojas e revisão de pull requests</li><li>Registro do que foi feito para o time continuar</li></ul>
          <h2>FAQ</h2>
          <h3>Você trabalha só com React Native?</h3><p>Não. React Native é a especialidade mais profunda, e também entrego sites, sistemas web, SaaS e integrações com React, Next.js, Angular, TypeScript e Firebase.</p><h3>Precisa ser Expo?</h3><p>Não. Expo acelera muitos produtos, mas um app já publicado em bare workflow continua sendo um projeto viável. A escolha segue o que já existe.</p><h3>Como é o contato durante o trabalho?</h3><p>Comunicação direta, ciclos visíveis e demonstrações do que mudou. O canal principal é combinado no início: WhatsApp, e-mail ou as ferramentas do time.</p>
