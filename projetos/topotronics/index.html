          <h1>Topotronics</h1>
          <p>App independente para cálculos de engenharia de estradas, com conta, publicação e assinatura.</p>
          <h2>Problema</h2>
          <p>O produto precisava ser mais do que uma calculadora: precisão, publicação nas lojas e um fluxo de assinatura que o usuário consegue completar. Como produto solo, manutenção e cobrança entram no mesmo desenho.</p>
          <h2>Participação</h2>
          <p>Desenvolvimento ponta a ponta: aplicativo, Firebase, assinaturas com Asaas e publicação nas lojas.</p>
          <h2>Solução</h2>
          <p>React Native com Firebase no backend e Asaas para pagamento recorrente. Estados de assinatura e acesso fazem parte do produto, não de um extra posterior.</p>
          <h2>Impacto</h2>
          <p>Produto publicado e em manutenção contínua, com fluxo de assinatura operacional. Não informo faturamento nem número de assinantes.</p>
