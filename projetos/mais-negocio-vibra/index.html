          <h1>Mais Negócio Vibra</h1>
          <p>Produto mobile usado na operação da Vibra Energia, em evolução contínua por um time alocado.</p>
          <h2>Problema</h2>
          <p>Um aplicativo corporativo em produção precisa absorver novas entregas sem quebrar a rotina de quem usa no campo. O trabalho está em estabilidade, performance e integração com serviços internos — não em um lançamento único.</p>
          <h2>Participação</h2>
          <p>Como desenvolvedor React Native sênior (BRQ, alocado na Vibra Energia), atuo na evolução do produto: jornadas, arquitetura, performance e integrações com APIs internas.</p>
          <h2>Solução</h2>
          <p>Melhorias contínuas de arquitetura, tratamento de falhas e atenção às jornadas mais usadas. O critério é o app continuar utilizável enquanto o roadmap anda.</p>
          <h2>Impacto</h2>
          <p>A descrição cobre responsabilidade e tipo de produto. Detalhes internos, dados de clientes e métricas não públicas permanecem omitidos. O que posso afirmar: o produto segue em uso operacional e a atuação é de evolução em produção, não de um protótipo.</p>
