          <h1>Gazin Bank</h1>
          <p>Aplicativo financeiro com operações que dependem de APIs e de um feedback claro para o usuário.</p>
          <h2>Problema</h2>
          <p>Operações sensíveis falham na percepção do usuário quando o erro da API aparece cru ou o fluxo não explica o próximo passo. O trabalho era tornar transações compreensíveis e a integração previsível.</p>
          <h2>Participação</h2>
          <p>Implementação de fluxos transacionais, telas de operação e integrações em React Native.</p>
          <h2>Solução</h2>
          <p>Separação da camada de integração, feedbacks de erro consistentes e fluxos guiados. PIX e demais operações seguem o mesmo critério: estado visível, falha tratada, próximo passo claro.</p>
          <h2>Impacto</h2>
          <p>A descrição cobre responsabilidade e tipo de produto. Detalhes internos, dados de clientes e métricas não públicas permanecem omitidos. Não publico volume de PIX, base de clientes ou indicadores internos.</p>
