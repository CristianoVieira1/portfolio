    <noscript><main>
          <h1>Jobtto</h1>
          <p>Plataforma para conectar demanda e profissionais, com a mesma lógica de produto no aplicativo e no site.</p>
          <h2>Problema</h2>
          <p>Um marketplace só funciona quando cadastro, busca, contratação e acompanhamento existem nos dois lados — quem pede o serviço e quem executa. O desafio era manter essa jornada coerente no mobile e na web, sem tratar um canal como versão reduzida do outro.</p>
          <h2>Participação</h2>
          <p>Atuei no aplicativo React Native e na interface web em React, incluindo navegação, integração com APIs e a consistência das jornadas principais entre os canais.</p>
          <h2>Solução</h2>
          <p>A base foi uma arquitetura modular, estados de carregamento e erro visíveis, e componentes reutilizáveis. O mobile cobre o uso no dia a dia; a web cobre consultas e fluxos que pedem tela maior, sem divergir a regra de negócio.</p>
          <h2>Impacto</h2>
          <p>O resultado é um produto que demonstra engenharia de marketplace — não só uma landing. Cadastro, contratação e presença web/mobile ficam no mesmo sistema de produto.</p>
