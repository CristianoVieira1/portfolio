          <h1>Colombo Bank</h1>
          <p>Aplicativo bancário para acompanhar cartão, limite e faturas no uso cotidiano.</p>
          <h2>Problema</h2>
          <p>Jornadas financeiras pedem clareza, previsibilidade e cuidado com erros. Conexão instável e variedade de aparelhos aumentam o risco de o usuário perder confiança no meio do fluxo.</p>
          <h2>Participação</h2>
          <p>Desenvolvimento das jornadas de autenticação, consulta e fluxos principais em React Native, com organização de estado e componentes reutilizáveis.</p>
          <h2>Solução</h2>
          <p>Componentes reutilizáveis, tratamento centralizado de erros e atenção à consistência das telas críticas. A interface prioriza leitura e confirmação, não efeito visual.</p>
          <h2>Impacto</h2>
          <p>A descrição cobre responsabilidade e tipo de produto. Detalhes internos, dados de clientes e métricas não públicas permanecem omitidos. O case serve para mostrar experiência em produto financeiro mobile, sem números de carteira ou volume de transações.</p>
