          <p>Aplicativo educacional para profissionais da construção, com conteúdo e jornadas de aprendizado.</p>

          <p>O produto precisava nascer utilizável: navegação, conteúdo e uma base que pudesse ganhar módulos depois. Sem isso, a primeira versão vira um protótipo difícil de manter.</p>
          <h2>Participação</h2>
          <p>Desenvolvimento freelancer da plataforma mobile, da concepção à entrega, incluindo módulos de navegação, conteúdo e experiência.</p>
          <h2>Solução</h2>
          <p>React Native com Firebase, arquitetura modular e fluxos pensados para uso recorrente. A usabilidade entrou no mesmo recorte das telas, não como um polimento final.</p>
          <h2>Impacto</h2>
          <p>Produto entregue como plataforma educacional mobile, com base possível de evoluir. Não há métricas públicas de retenção neste case.</p>
