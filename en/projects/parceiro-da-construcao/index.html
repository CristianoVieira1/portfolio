          <h1>Parceiro da Construção</h1>
          <p>An educational app for construction professionals, with content and learning journeys.</p>
          <h2>Problem</h2>
          <p>The product had to ship usable: navigation, content and a foundation that could gain modules later. Without that, the first version becomes a prototype that is hard to maintain.</p>
          <h2>Role</h2>
          <p>Freelance development of the mobile platform, from concept to delivery, including navigation, content and experience modules.</p>
          <h2>Solution</h2>
          <p>React Native with Firebase, a modular architecture and flows designed for recurring use. Usability was part of the same slice as the screens, not a final polish.</p>
          <h2>Impact</h2>
          <p>A product delivered as a mobile learning platform, with a foundation that can evolve. There are no public retention metrics in this case.</p>
