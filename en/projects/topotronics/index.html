          <h1>Topotronics</h1>
          <p>An independent app for road engineering calculations, with accounts, store release and subscriptions.</p>
          <h2>Problem</h2>
          <p>The product had to be more than a calculator: precision, store release and a subscription flow the user can complete. As a solo product, maintenance and billing are part of the same design.</p>
          <h2>Role</h2>
          <p>End-to-end development: app, Firebase, Asaas subscriptions and store publishing.</p>
          <h2>Solution</h2>
          <p>React Native with Firebase on the backend and Asaas for recurring payment. Subscription and access states are part of the product, not a later extra.</p>
          <h2>Impact</h2>
          <p>A published product under continuous maintenance, with an operational subscription flow. I do not disclose revenue or subscriber counts.</p>
