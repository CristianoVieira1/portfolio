          <h1>Sistema SIGA</h1>
          <p>A system used in operations, with both an app and a web presence.</p>
          <h2>Problem</h2>
          <p>When mobile and web diverge, the operations team is working in two products. The challenge was keeping consistency and a structure that could accept new functions without restarting each channel.</p>
          <h2>Role</h2>
          <p>Development of mobile and web interfaces and structure for joint evolution.</p>
          <h2>Solution</h2>
          <p>React Native and React, shared components where they made sense, and integration between channels.</p>
          <h2>Impact</h2>
          <p>A foundation ready for new features. There are no public usage metrics in this case.</p>
