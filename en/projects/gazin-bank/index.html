          <h1>Gazin Bank</h1>
          <p>A financial app with operations that depend on APIs and clear feedback for the user.</p>
          <h2>Problem</h2>
          <p>Sensitive operations fail in the user's perception when an API error shows up raw or the flow does not explain the next step. The work was making transactions understandable and the integration predictable.</p>
          <h2>Role</h2>
          <p>Implementation of transactional flows, operation screens and integrations in React Native.</p>
          <h2>Solution</h2>
          <p>A separated integration layer, consistent error feedback and guided flows. PIX and other operations follow the same criterion: visible state, handled failure, clear next step.</p>
