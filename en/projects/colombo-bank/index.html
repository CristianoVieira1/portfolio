          <h1>Colombo Bank</h1>
          <p>A banking app for tracking cards, limits and statements in everyday use.</p>
          <h2>Problem</h2>
          <p>Financial journeys need clarity, predictability and careful error handling. Unstable connections and device variety increase the risk of the user losing trust mid-flow.</p>
          <h2>Role</h2>
          <p>Development of authentication, inquiry and core journeys in React Native, with structured state and reusable components.</p>
          <h2>Solution</h2>
          <p>Reusable components, centralized error handling and consistency on critical screens. The interface prioritizes reading and confirmation, not visual effect.</p>
