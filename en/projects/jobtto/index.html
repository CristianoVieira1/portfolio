          <h1>Jobtto</h1>
          <p>A platform that connects demand and professionals, with the same product logic on the app and the website.</p>
          <h2>Problem</h2>
          <p>A marketplace only works when sign-up, search, hiring and follow-up exist on both sides — the person requesting the service and the person delivering it. The challenge was keeping that journey coherent on mobile and web, without treating one channel as a reduced copy of the other.</p>
          <h2>Role</h2>
          <p>I worked on the React Native app and the React web interface, including navigation, API integration and consistency of the main journeys across channels.</p>
          <h2>Solution</h2>
          <p>The foundation was a modular architecture, visible loading and error states, and reusable components. Mobile covers day-to-day use; the web covers lookups and flows that need a larger screen, without splitting the business rules.</p>
          <h2>Impact</h2>
          <p>The result is a product that demonstrates marketplace engineering — not just a landing page. Sign-up, hiring and web/mobile presence sit in the same product system.</p>
