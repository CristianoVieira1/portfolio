        <h1>Custom software development.</h1>
        <p>I turn your ideas into high-quality apps, websites and systems.</p>
        <p>Senior software developer specialized in scalable digital products for companies, startups and founders. React Native, React, Next.js, Angular, TypeScript and integrations — with a focus on timeline, clarity and software people can actually use.</p>
        <h2>Software engineering services.</h2>
        <ul><li><a href="https://cristianovieira1.github.io/portfolio/en/services/mobile-app-development/">Mobile app development</a> — Apps for companies that need to leave the idea stage, unblock a product or put an operation in the customer's pocket. The focus is a usable, stable product that can evolve.</li><li><a href="https://cristianovieira1.github.io/portfolio/en/services/react-native/">React Native developer</a> — React Native is the stack I use most to ship mobile products. I use it to take an app from zero, stabilize a product in production or support a team without adding permanent headcount.</li><li><a href="https://cristianovieira1.github.io/portfolio/en/services/professional-websites/">Professional websites</a> — Websites for teams that need to explain an offer clearly, show up better in search and turn a visit into a conversation. The visual design follows the content.</li><li><a href="https://cristianovieira1.github.io/portfolio/en/services/web-systems/">Web system development</a> — Systems that replace spreadsheets, email and manual process when the operation has outgrown a brochure website. The criterion is the routine of the people using it, not a generic dashboard.</li><li><a href="https://cristianovieira1.github.io/portfolio/en/services/saas-development/">SaaS development</a> — SaaS products for teams that need to turn a repeatable service into software: account, permission, billing and a routine the customer comes back to.</li><li><a href="https://cristianovieira1.github.io/portfolio/en/services/consulting-and-modernization/">Consulting and system modernization</a> — For teams that already have software and need clarity: what to fix, what to keep and what is not worth rewriting now.</li></ul>
        <h2>Real systems, with commercial context.</h2>
        <ul><li><a href="https://cristianovieira1.github.io/portfolio/en/projects/jobtto/">Jobtto</a> — A platform that connects demand and professionals, with the same product logic on the app and the website.</li><li><a href="https://cristianovieira1.github.io/portfolio/en/projects/mais-negocio-vibra/">Mais Negócio Vibra</a> — A mobile product used in Vibra Energia operations, under continuous evolution by an allocated team.</li><li><a href="https://cristianovieira1.github.io/portfolio/en/projects/colombo-bank/">Colombo Bank</a> — A banking app for tracking cards, limits and statements in everyday use.</li><li><a href="https://cristianovieira1.github.io/portfolio/en/projects/gazin-bank/">Gazin Bank</a> — A financial app with operations that depend on APIs and clear feedback for the user.</li><li><a href="https://cristianovieira1.github.io/portfolio/en/projects/parceiro-da-construcao/">Parceiro da Construção</a> — An educational app for construction professionals, with content and learning journeys.</li><li><a href="https://cristianovieira1.github.io/portfolio/en/projects/pontotel/">Bateponto Pontotel</a> — A time-tracking app used every day, where check-in has to work even with a poor connection.</li><li><a href="https://cristianovieira1.github.io/portfolio/en/projects/topotronics/">Topotronics</a> — An independent app for road engineering calculations, with accounts, store release and subscriptions.</li><li><a href="https://cristianovieira1.github.io/portfolio/en/projects/siga-system/">Sistema SIGA</a> — A system used in operations, with both an app and a web presence.</li><li><a href="https://cristianovieira1.github.io/portfolio/en/projects/otica-house/">Ótica House</a> — Web e-commerce focused on catalog, funnel clarity and the VTEX platform.</li></ul>
        <h2>Before we request a quote.</h2>
        <h3>What kind of project do you take on?</h3><p>iOS and Android apps, professional websites, web systems, SaaS and consulting to modernize what already exists. React Native is the deepest specialty; web and integrations come in when the product needs them.</p><h3>Do I need to understand React Native to hire you?</h3><p>No. Companies hire an outcome: an app, a website, a system or a recurring product. The stack is a tool. In the quote conversation we talk about the problem, the timeline and the slice.</p><h3>How does quoting work?</h3><p>You describe the goal, the project type and the timeline. I reply with focused questions and a proposed slice. There is no public price table because effort changes with what already exists.</p><h3>Do you work per project or per period?</h3><p>Both. Fixed scope for defined deliveries; hourly or monthly for evolution and team support.</p><h3>Do you only work in Porto Alegre?</h3><p>I am based in Porto Alegre, Rio Grande do Sul, and work remotely across Brazil. In-person meetings only when the project needs them and they are feasible.</p>
