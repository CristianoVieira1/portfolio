          <h1>React Native developer</h1>
          <p>React Native is the stack I use most to ship mobile products. I use it to take an app from zero, stabilize a product in production or support a team without adding permanent headcount.</p>
          <p>Teams look for a React Native developer when the roadmap has stalled, the codebase is hard to change or the product needs someone who can connect interface, integration and release. I work in that space: code, product judgment and direct communication with decision makers. I am based in Porto Alegre, Rio Grande do Sul, and work remotely with companies across Brazil.</p>
          <h2>Benefits</h2>
          <h3>Product and code together</h3><p>Technical decisions account for the people using the app and what the business needs to ship now.</p><h3>Production, not only prototypes</h3><p>Experience with financial, operational, educational and marketplace apps already in use.</p><h3>Joining an existing codebase</h3><p>A read of the codebase, the risks and the release flow before promising a delivery sequence.</p><h3>Fixed scope or retainer</h3><p>Fixed project, hourly work or monthly support, depending on how the team works.</p>
          <h2>Deliverables</h2>
          <ul><li>Initial review of code, dependencies and release</li><li>New journeys or fixes to critical flows</li><li>State, navigation and API integration structure</li><li>Performance and stability work on the most used screens</li><li>Support for builds, stores and pull request review</li><li>A record of the work so the team can continue</li></ul>
          <h2>FAQ</h2>
          <h3>Do you only work with React Native?</h3><p>No. React Native is the deepest specialty, and I also deliver websites, web systems, SaaS and integrations with React, Next.js, Angular, TypeScript and Firebase.</p><h3>Does it have to be Expo?</h3><p>No. Expo speeds up many products, but an app already published on the bare workflow is still a viable project. The choice follows what already exists.</p><h3>How do we communicate during the work?</h3><p>Direct communication, visible cycles and demos of what changed. The main channel is agreed at the start: WhatsApp, email or the team's tools.</p>
