          <h1>SaaS development</h1>
          <p>SaaS products for teams that need to turn a repeatable service into software: account, permission, billing and a routine the customer comes back to.</p>
          <p>A SaaS product is not a website with a login. It needs accounts, data isolation, billing, subscription states and a clear path to a useful first session. I help cut that first version and build the foundation without promising an infinite platform in month one. I am based in Porto Alegre, Rio Grande do Sul, and work remotely with companies across Brazil.</p>
          <h2>Benefits</h2>
          <h3>A first version that charges or validates</h3><p>The initial slice includes the session that proves value and, when it is part of the model, the subscription flow.</p><h3>Web, mobile or both</h3><p>The channel follows the use: a web dashboard, an app or both, without duplicating rules unnecessarily.</p><h3>Billing as a flow, not a detail</h3><p>Payment, access and failure states are part of the design. In the Topotronics product, subscriptions use Asaas.</p><h3>Evolution after launch</h3><p>The foundation stays ready for new modules without restarting the product for every idea.</p>
          <h2>Deliverables</h2>
          <ul><li>Definition of the user, the account and the core session</li><li>Access model and separation of customer data</li><li>The agreed subscription or commercial validation flow</li><li>Web interface and, if needed, a mobile app</li><li>Error, failed-payment and first-access states</li><li>A plan for what waits for later versions</li></ul>
          <h2>FAQ</h2>
          <h3>Do you build the whole SaaS alone?</h3><p>I can take a first version live and evolve the product. If the scope needs a team, I join as the technical owner of a stream or define the slice that fits one specialist.</p><h3>Which payment gateway do you use?</h3><p>It depends on what the business already has. In Topotronics, recurring billing was integrated with Asaas. Other products can use the provider the company already contracted.</p><h3>How long does a SaaS take?</h3><p>There is no single timeline. A narrow first version can fit a few cycles; a platform with many roles cannot. The timeline comes from the scope, not from a generic table.</p>
