          <h1>Web system development</h1>
          <p>Systems that replace spreadsheets, email and manual process when the operation has outgrown a brochure website. The criterion is the routine of the people using it, not a generic dashboard.</p>
          <p>Companies arrive with a flow spread across spreadsheets, messages and systems that do not talk to each other. A well-defined web system concentrates the operation: records, permissions, status, integrations and a history the team can consult. I shape that scope with you and deliver it in parts that enter daily work. I am based in Porto Alegre, Rio Grande do Sul, and work remotely with companies across Brazil.</p>
          <h2>Benefits</h2>
          <h3>Workflow before screens</h3><p>The system starts from the real process: who does what, what changes state and where the data lives.</p><h3>Integration with what already exists</h3><p>APIs, authentication and external services are part of the design instead of an undefined later phase.</p><h3>Usable deliveries</h3><p>Each stage leaves part of the process working, so the team can validate it with real use.</p><h3>A base that can grow</h3><p>Modules, permissions and integrations organized so the system does not depend on one giant file.</p>
          <h2>Deliverables</h2>
          <ul><li>A map of the process and the first slice of the system</li><li>Authentication, roles and core journeys</li><li>Operational screens and the agreed business rules</li><li>Integrations with APIs and services the company already uses</li><li>Error handling, empty states and permissions</li><li>A short architecture note and a record of what was left out</li></ul>
          <h2>FAQ</h2>
          <h3>Are a web system and a website the same thing?</h3><p>No. A website presents the company and captures contact. A system runs the work: records, orders, permissions, routines and integrations.</p><h3>Can you modernize an old system?</h3><p>Yes. That work also lives under consulting and modernization. Rewriting, wrapping or migrating in parts depends on the risk and on what is already in use.</p><h3>Do you build the backend?</h3><p>I integrate and, when the scope requires it, implement the layer the project needs with its tools, such as Firebase or APIs. If a backend already exists, I build on top of it.</p>
