          <h1>Professional websites</h1>
          <p>Websites for teams that need to explain an offer clearly, show up better in search and turn a visit into a conversation. The visual design follows the content.</p>
          <p>A professional website fails when visitors cannot understand the service, contact is hidden or the page depends on effects to say something simple. I structure the message, the hierarchy and the technical layer so the page is fast, indexable and easy to use on a phone. I am based in Porto Alegre, Rio Grande do Sul, and work remotely with companies across Brazil.</p>
          <h2>Benefits</h2>
          <h3>Message before decoration</h3><p>The first screen says what you do, who it is for and how to start a conversation.</p><h3>SEO in the HTML</h3><p>Title, description, heading, content and structured data considered for each page, not only the homepage.</p><h3>Contact without friction</h3><p>A form, WhatsApp or email at the point where the person already understands the offer.</p><h3>Mobile as the default</h3><p>Reading, buttons and speed designed from the small screen, where most visits arrive.</p>
          <h2>Deliverables</h2>
          <ul><li>Page structure and offer-oriented copy</li><li>Responsive layout and applied visual identity</li><li>On-page technical SEO: title, description, heading and sitemap</li><li>A working form or contact channel</li><li>Image, font and initial-load performance</li><li>Launch and guidance for the next iteration</li></ul>
          <h2>FAQ</h2>
          <h3>Can the website grow into a system?</h3><p>Yes, if that is on the horizon. The first delivery can be the commercial website, with a structure that does not block an admin panel or a logged-in area later.</p><h3>Do you write the content?</h3><p>I organize the structure and draft the copy from what you know about the business. You keep the final review of the offer, because nobody replaces the owner's knowledge.</p><h3>Does a company website fit this service?</h3><p>Yes. Company websites, service pages and lead-generation sites fit here. Stores and platforms with heavier business rules tend to fit web systems or SaaS.</p>
