          <h1>Consulting and system modernization</h1>
          <p>For teams that already have software and need clarity: what to fix, what to keep and what is not worth rewriting now.</p>
          <p>Modernizing a system fails when the first proposal is to throw everything away. I start from real use, the code and the release path. The result is a sequence: risks, quick gains and the structural changes that actually free the roadmap. I am based in Porto Alegre, Rio Grande do Sul, and work remotely with companies across Brazil.</p>
          <h2>Benefits</h2>
          <h3>Diagnosis before the rebuild</h3><p>An honest read of what is fragile and what can stay as it is.</p><h3>A plan the team can execute</h3><p>Consulting can stop at the plan or continue into implementation of the first deliveries.</p><h3>Senior support when it is needed</h3><p>A temporary engagement to unblock a critical delivery without hiring a permanent team.</p><h3>The stack you already have</h3><p>React Native, React, Next.js, Angular, TypeScript and Firebase, following the system you already have.</p>
          <h2>Deliverables</h2>
          <ul><li>A read of the code, the release flow and the risks</li><li>A prioritized list of fixes and structural changes</li><li>A recommendation of what not to do now</li><li>Implementation of the first improvements, if contracted</li><li>Support for architecture decisions with the team</li><li>A concise record for whoever continues the work</li></ul>
          <h2>FAQ</h2>
          <h3>Does consulting include code?</h3><p>It can. There is a diagnosis-only format and another where I implement the first changes. Both are agreed before the work starts.</p><h3>Do you rewrite the system?</h3><p>Only when a rewrite is safer than evolving what exists. In most cases, modernization happens in parts, while the current system stays in use.</p><h3>Is this for recruiters?</h3><p>This service is for companies that need technical judgment. Recruiters will find experience, stack and a résumé on the career page.</p>
