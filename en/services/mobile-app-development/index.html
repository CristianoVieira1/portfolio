          <h1>Mobile app development</h1>
          <p>Apps for companies that need to leave the idea stage, unblock a product or put an operation in the customer's pocket. The focus is a usable, stable product that can evolve.</p>
          <p>An app usually stalls when the scope mixes validation with an entire platform, or when production code no longer matches real use. I define what must exist now, build the core journeys and leave integrations, release and maintenance in order. I am based in Porto Alegre, Rio Grande do Sul, and work remotely with companies across Brazil.</p>
          <h2>Benefits</h2>
          <h3>One codebase, two stores</h3><p>iOS and Android from a shared codebase when that reduces time and cost without sacrificing the experience.</p><h3>Scope that fits the moment</h3><p>MVP, evolution or team support, with deliveries the business can use and evaluate.</p><h3>Real integrations</h3><p>Authentication, APIs, notifications, payments and the services a product needs beyond a prototype.</p><h3>Release support</h3><p>Preparation for the App Store and Google Play, including the build flow and the care a real release needs.</p>
          <h2>Deliverables</h2>
          <ul><li>Review of the goal, the user and the technical constraints</li><li>Architecture and scope of the first usable version</li><li>Main interfaces and user journeys</li><li>Integration with APIs, authentication and third-party services</li><li>Builds, critical-path checks and store preparation</li><li>Handover for the team that will maintain the product</li></ul>
          <h2>FAQ</h2>
          <h3>Can we launch an MVP first?</h3><p>Yes. The first version covers what validates the operation or the value proposition, without forcing the rest of the roadmap to ship at once.</p><h3>Can you take over an existing app?</h3><p>Yes. I start by reading the code, dependencies, release process and risks. Deliveries then follow a safe order across fixes, structure and features.</p><h3>Does the app need a site or admin panel too?</h3><p>When the business needs it, the app can ship with a website, an admin panel or a web system. That is defined in the scope, not added as a surprise.</p>
