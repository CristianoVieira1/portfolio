<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Página não encontrada | Cristiano Borges</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #060606;
        --fg: #e8eef8;
        --muted: #9aa6b8;
        --accent: #8b5cf6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: Rubik, system-ui, sans-serif;
        background:
          radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.18), transparent 40%),
          radial-gradient(circle at 80% 70%, rgba(37, 99, 235, 0.16), transparent 42%),
          var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 34rem;
        text-align: center;
      }
      p {
        color: var(--muted);
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        margin-top: 1.25rem;
        padding: 0.85rem 1.35rem;
        border-radius: 999px;
        background: linear-gradient(135deg, #8b5cf6, #2563eb, #10b981);
        color: white;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404 — Página não encontrada</h1>
      <p>
        O endereço que você tentou abrir não existe neste portfólio. Volte para a
        página inicial para ver projetos e formas de contato.
      </p>
      <a href="/portfolio/">Voltar ao portfólio</a>
    </main>
  </body>
</html>
